# Look4Sat iOS — xcodegen spec for headless Xcode project generation
# License: GPL-3.0

name: Look4Sat

options:
  compatibilityVersion: 13
  bundlePrefix: "com.example"
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  Look4SatCore:
    path: "."

targets:
  Look4Sat:
    type: application
    platform: iOS
    sources:
      - path: app
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: Look4SatCore
        product: Look4SatCore
    info:
      path: Info.plist
      properties:
        # These are real Info.plist keys, not Xcode build-setting names.
        NSPhotoLibraryUsageDescription: "Look4Sat saves rendered satellite maps to your photo library."
        UIRequiresFullScreen: true
    settings:
      base:
        # The bundle identifier must be an Xcode build setting so that
        # Info.plist's CFBundleIdentifier substitution is populated.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.look4sat
        PRODUCT_NAME: Look4Sat
        PRODUCT_MODULE_NAME: Look4Sat
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_USER_SCRIPT_SANDBOXING: false

        # Unsigned archive: AltStore will sign the app during installation.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: NO
        SWIFT_OPTIMIZATION_LEVEL: -O
        OTHER_SWIFT_FLAGS: ["$(inherited)", "-no-verify-emitted-module-interface"]
