# Look4Sat iOS — GitHub Actions build workflow
# Builds an unsigned iOS archive and packages it as an AltStore-importable IPA.

name: iOS Build (AltStore .ipa)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_ALLOWED: "NO"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -e
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode app found on this runner"
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcode-select -p
          xcodebuild -version

      - name: Run Swift tests (macOS)
        run: |
          swift build
          swift test

      - name: Generate Xcode project
        run: |
          set -e
          which xcodegen || brew install xcodegen
          xcodegen --version
          xcodegen generate
          test -f Look4Sat.xcodeproj/project.pbxproj

      - name: Build & archive for device (no signing)
        run: |
          set -e
          mkdir -p build
          xcodebuild \
            -project Look4Sat.xcodeproj \
            -scheme Look4Sat \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            archive \
            -archivePath build/Look4Sat.xcarchive \
            SKIP_INSTALL=NO

      - name: Validate archived app metadata
        run: |
          set -euo pipefail
          APP_PATH="build/Look4Sat.xcarchive/Products/Applications/Look4Sat.app"
          PLIST="$APP_PATH/Info.plist"
          test -d "$APP_PATH"
          test -f "$PLIST"
          plutil -lint "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundlePackageType" "$PLIST"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLIST")
          test "$BUNDLE_ID" = "com.example.look4sat"
          test -f "$APP_PATH/$EXECUTABLE"
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundlePackageType" "$PLIST")" = "APPL"

      - name: Package .ipa (unsigned / AltStore)
        run: |
          set -euo pipefail
          APP_PATH="build/Look4Sat.xcarchive/Products/Applications/Look4Sat.app"
          STAGING_DIR="build/ipa-staging"
          EXPORT_DIR="build/export"

          rm -rf "$STAGING_DIR" "$EXPORT_DIR"
          mkdir -p "$STAGING_DIR/Payload" "$EXPORT_DIR"
          ditto "$APP_PATH" "$STAGING_DIR/Payload/Look4Sat.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$STAGING_DIR/Payload" "$EXPORT_DIR/Look4Sat.ipa"

          test -s "$EXPORT_DIR/Look4Sat.ipa"
          unzip -t "$EXPORT_DIR/Look4Sat.ipa"
          unzip -Z1 "$EXPORT_DIR/Look4Sat.ipa" | grep -qx "Payload/Look4Sat.app/Info.plist"
          unzip -p "$EXPORT_DIR/Look4Sat.ipa" "Payload/Look4Sat.app/Info.plist" > build/ipa-info.plist
          plutil -lint build/ipa-info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/ipa-info.plist | grep -qx "com.example.look4sat"
          ls -lh "$EXPORT_DIR/Look4Sat.ipa"

      - name: Show .ipa output
        run: |
          ls -lh build/export/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: look4sat-ios
          path: build/export/Look4Sat.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Upload xcarchive for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: look4sat-xcarchive
          path: build/Look4Sat.xcarchive
          if-no-files-found: warn
          retention-days: 30

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow YAML
        run: |
          python3 - <<'PY'
          import yaml
          with open(".github/workflows/ios-build.yml", encoding="utf-8") as f:
              yaml.safe_load(f)
          print("Workflow YAML valid")
          PY

      - name: Validate project.yml (xcodegen spec)
        run: |
          python3 - <<'PY'
          import yaml
          with open("project.yml", encoding="utf-8") as f:
              yaml.safe_load(f)
          print("project.yml valid")
          PY
